<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 64" width="88" height="64">
  <!-- openACB mark: a ball in flight. The seams cut it into facets lit from the
       top left (amber light, orange body, rust shade). The seams are see-through,
       so the mark works on light and dark backgrounds. -->
  <defs>
    <mask id="seams">
      <circle r="28" fill="#fff"/>
      <path d="M0-30V30M-30 0H30M-19.82-19.82A28 28 0 0 1-19.82 19.82M19.82-19.82A28 28 0 0 0 19.82 19.82" fill="none" stroke="#000" stroke-width="4.6"/>
    </mask>
  </defs>
  <g fill="none" stroke-width="5.2" stroke-linecap="round">
    <path d="M20 21H10" stroke="#ff9a4d"/>
    <path d="M22 32H4" stroke="#fe5917"/>
    <path d="M20 43H12" stroke="#ff9a4d"/>
  </g>
  <g transform="translate(58 32) rotate(-18)">
    <g mask="url(#seams)">
      <rect x="-32" y="-32" width="32" height="32" fill="#ff9a4d"/>
      <rect y="-32" width="32" height="32" fill="#fe5917"/>
      <rect x="-32" width="32" height="32" fill="#fe5917"/>
      <rect width="32" height="32" fill="#d04313"/>
    </g>
  </g>
</svg>
